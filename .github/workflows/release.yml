name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Swift 6.2
        run: |
          curl -fLo swift.pkg "https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg"
          sudo installer -pkg swift.pkg -target /
          export TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw /Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain/Info.plist)
          echo "TOOLCHAINS=$TOOLCHAINS" >> "$GITHUB_ENV"
          swift --version

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist version
        id: plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLIST="Packaging/SnapX-Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          # Use tag number as build number (v0.1.0 -> 10, v1.2.3 -> 123)
          TAG="${{ steps.version.outputs.tag }}"
          BUILD_NUM=$(echo "${TAG#v}" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Build arm64
        run: bash Scripts/build_app.sh arm64

      - name: Build x86_64
        run: bash Scripts/build_app.sh x86_64

      - name: Build universal
        run: bash Scripts/build_app.sh universal

      - name: Create DMGs and ZIPs
        id: artifacts
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUTPUTS=""

          for ARCH in arm64 x86_64 universal; do
            APP="Build/SnapX-${ARCH}.app"
            DMG="Build/SnapX-${TAG}-${ARCH}.dmg"
            ZIP="Build/SnapX-${TAG}-${ARCH}.zip"

            # Create DMG
            STAGING="dmg_staging_${ARCH}"
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            cp -R "$APP" "$STAGING/SnapX.app"
            ln -s /Applications "$STAGING/Applications"
            [[ -f Packaging/DMG-README.txt ]] && cp Packaging/DMG-README.txt "$STAGING/"
            hdiutil create -volname "SnapX" \
              -srcfolder "$STAGING" \
              -ov -format UDZO \
              "$DMG"

            # Create ZIP
            cd Build
            ditto -c -k --keepParent "SnapX-${ARCH}.app" "SnapX-${TAG}-${ARCH}.zip"
            cd ..

            OUTPUTS="${OUTPUTS} ${DMG} ${ZIP}"
          done

          echo "files=${OUTPUTS}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$TAG")
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}")
          fi

          echo "## What's Changed" > /tmp/changelog.md
          echo "$COMMITS" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> /tmp/changelog.md

      - name: Sign Sparkle and update appcast
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUM="${{ steps.plist.outputs.build_num }}"
          UNIVERSAL_DMG="Build/SnapX-${TAG}-universal.dmg"
          DMG_SIZE=$(stat -f%z "$UNIVERSAL_DMG" 2>/dev/null || echo "0")
          SIG="PLACEHOLDER_SIGNATURE"

          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
            SIGN_UPDATE="Vendor/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework/Versions/B/Resources/AutoUpdate"
            if [ -f "$SIGN_UPDATE" ]; then
              RAW_SIG=$("$SIGN_UPDATE" -s /tmp/sparkle_key "$UNIVERSAL_DMG" 2>/dev/null || true)
              EXTRACTED=$(echo "$RAW_SIG" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//' || true)
              [ -n "$EXTRACTED" ] && SIG="$EXTRACTED"
            fi
            rm -f /tmp/sparkle_key
          fi

          echo "signature=$SIG" >> "$GITHUB_OUTPUT"

          # Update appcast.xml using Python
          python3 -c "
          import re
          with open('docs/appcast.xml', 'r') as f:
              content = f.read()

          # Remove existing entry for this version if any
          pattern = r'<item>\\s*<title>Version $VERSION</title>.*?</item>'
          content = re.sub(pattern, '', content, flags=re.DOTALL)

          item = '''        <item>
              <title>Version $VERSION</title>
              <sparkle:version>$BUILD_NUM</sparkle:version>
              <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
              <description><![CDATA[
                  <h3>更新内容</h3>
                  <ul>
                      <li>详见 Release Notes</li>
                  </ul>
              ]]></description>
              <pubDate>$(date -R)</pubDate>
              <enclosure
                  url=\"https://github.com/${{ github.repository }}/releases/download/$TAG/SnapX-$TAG-universal.dmg\"
                  sparkle:edSignature=\"$SIG\"
                  length=\"$DMG_SIZE\"
                  type=\"application/octet-stream\"
                  sparkle:minimumSystemVersion=\"13.0\"
              />
          </item>'''

          content = content.replace('<channel>', '<channel>\n' + item, 1)
          with open('docs/appcast.xml', 'w') as f:
              f.write(content)
          print('Appcast updated for $TAG')
          "

      - name: Push appcast update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git stash
          git checkout main
          git stash pop
          git diff --cached --quiet || git commit -m "docs: 更新 appcast.xml 添加 ${{ steps.version.outputs.tag }}"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SnapX ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.md
          files: |
            Build/SnapX-${{ steps.version.outputs.tag }}-arm64.dmg
            Build/SnapX-${{ steps.version.outputs.tag }}-arm64.zip
            Build/SnapX-${{ steps.version.outputs.tag }}-x86_64.dmg
            Build/SnapX-${{ steps.version.outputs.tag }}-x86_64.zip
            Build/SnapX-${{ steps.version.outputs.tag }}-universal.dmg
            Build/SnapX-${{ steps.version.outputs.tag }}-universal.zip
          draft: false
          prerelease: false
